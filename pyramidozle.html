<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
body {
  font-family: sans-serif;
  padding: 20px;
  display: flex;
  justify-content: center;
  background-image: 
   linear-gradient(to top, #102842, rgba(255,255,255,0.25)),     url("https://nomynoma.github.io/storage/dia.png");
  background-color: #102842;
  background-blend-mode: lighten;
  background-repeat: no-repeat;
  background-position: center;
  background-size: cover;
  color: #ccc;
}

a {
  padding-right: 2px;
  color: #ddd;
  &:visited,
  &:hover,
  &:active,
  &:focus {
    color: #ddd;
    text-decoration: none;
  }

}

.container {
  max-width: 800px;
  text-align: center;
}

.controls {
  margin-bottom: 10px;
}

.controls input {
  width: 60px;
  padding: 5px;
  margin: 0 10px;
}

.buttons button {
  padding: 10px 15px;
  margin: 5px;
  font-size: 16px;
  cursor: pointer;
}

.pyramid {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 20px;
}

.row {
  display: flex;
  justify-content: center;
  height: 7px; /* ブロック高さと一致させる */
  position: relative; /* 横線と数字を重ねるため */
}

.row:after {
  content: "";
  position: absolute;
  width: 100%;
  border-top: 1px solid #666; /* 横線 */
  top: 50%; /* 横線の位置を中央に */
}

.row-number {
  position: absolute;
  right: -15px; /* 横線の右側に数字を表示 */
  font-size: 12px;
  color: #eee;
  border-bottom: 1px solid #999;
  width: 15px;
  text-align: right;
  top: -2px;
  height: 5px;
  &.btm {
    top: 5px;
    right: -20px;
  }
  
  .number-text {
    position: absolute;
    top: -5px;
    right: -20px;
    opacity: 0.5;
    &.btm {
      top: -5px;
    }
  }
  
}

.block {
  width: 5px;
  height: 5px;
  margin: 0;
  background: linear-gradient(135deg, #6ce0f1, #4fd2e2, #a0faff);
  border: 0.5px solid #9cf;
  box-shadow: inset 0 0 1px #fff, 0 1px 2px rgba(0, 0, 0, 0.4);
  opacity: 0;
  transform: translateY(-30px) ; /* 初期位置を上にずらす */
  transition: 
    opacity 0.3s ease, 
    background 0.3s ease, 
    transform 0.3s ease; /* アニメーションに transform を追加 */
  z-index: 1;
  &.odd {
  background: linear-gradient(135deg, #5ac4e2, #3eaed4, #87d8f2);
  }
}

.block.visible, .block.visible2 {
  opacity: 1;
  transform: translateY(0); /* 元の位置に移動 */
}


input[readonly] {
  background-color: transparent;
  border: none;  /* 薄いグレーの枠 */
  color: #fff;  /* テキストカラーを薄く */
  pointer-events: none;
}

.texts {
  font-size: 16px;
  input {
    font-size: 16px !important;
    width: 6rem;
  }
}


#toggleButton {
  cursor: pointer;
  background-color: transparent;
  color: white;
  font-weight: 400;
  padding: 0;
  border: none;
  border-radius: 8px;
  margin: 0;
  font-size: 12px;
}
#g_container {
  width: 100%;
  height: 300px;
  display: none; /* 初期状態は非表示 */
  border-radius: 16px;
  overflow: hidden; 
}


  </style>
</head>
<body>
 <script src="https://code.highcharts.com/highcharts.js"></script>
<div class="container">
    <h1><a href="https://x.com/hashtag/%E3%83%94%E3%83%A9%E3%83%9F%E3%83%83%E3%83%89%E3%82%BA%E3%83%AB" target="_blank">#ピラミッドズル</a>どこまで出来たかな？確認ツール</h1>
    <div style="margin: 1rem; padding: 1rem;">
<button id="toggleButton">今まで掘ったダイヤ数をグラフで確認▼</button>
<div id="g_container"></div>
    </div>
    
    <!-- 入力フォーム: 作成するブロック数 -->
    <div class="texts">
      <div class="controls">
        <label for="blockCount">集めたダイヤ数: </label>
        <input type="number" id="diaCount" min="1" max="356409" value="277081">/356409<br/><br/>
    <label for="diamondBlocks">ダイヤモンドブロック数: </label>
    <input type="text" id="diamondBlocks" readonly>/39601
      </div>
      <p id="progress">現在の進捗は　%です。</p>
    </div>
    
    <div class="buttons">
      <button id="topStart">一番上から作成！</button>
      <button id="bottomStart">一番下から作成！</button>
      <button id="reset">リセット</button>
      <button id="cancel">キャンセル</button>
    </div>

    <div class="pyramid" id="pyramid"></div>
  </div>

  
  <script>
// グラフ
Highcharts.setOptions({
  time: {
    useUTC: false
  }
});
const times = [
  0, 3, 4, 5, 6,
  8, 9, 10, 11, 12,
  13, 15, 16, 17, 18,
  19, 20, 33, 34, 37,
  38, 39, 40, 41, 43,
  44, 
]; // 回数
const dates = [
  '2025/04/14', '2025/04/17', '2025/04/18', '2025/04/20', '2025/04/21',
  '2025/04/24', '2025/04/24', '2025/04/25', '2025/04/27', '2025/04/29',
  '2025/05/01', '2025/05/04', '2025/05/05', '2025/05/06', '2025/05/10',
  '2025/05/11', '2025/05/12', '2025/06/06', '2025/06/07', '2025/06/23',
  '2025/07/03', '2025/07/04', '2025/07/05', '2025/07/07', '2025/07/11',
  '2025/07/14',
  
]; // 日時
const diamondTotals = [
  0, 6537, 7343, 12870, 15252,
  19620, 22428, 27067, 32439, 40136,
  50579, 59339, 71856, 77501, 90345,
  100258, 110957, 208489, 228489, 236204,
  240530, 244492, 252456, 259805, 268931,
  277081,
]; // ダイヤの総数
const maxDiamonds = 356409; // 100%のダイヤ数

// 進捗率を計算
const progressPercentage = diamondTotals.map(total =>
  Math.min((total / maxDiamonds) * 100, 100)
);

// 日付配列をDateオブジェクトに変換しタイムスタンプ配列に
const dateTimestamps = dates.map(d => new Date(d).getTime());

// 日曜日だけのtickPositionsを作成
const tickPositions = [];
const startDate = new Date(dates[0]);
const endDate = new Date(dates[dates.length - 1]);

for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
  if (d.getDay() === 0) { // 日曜日だけ追加
    tickPositions.push(d.getTime());
  }
}

// ｘ軸最小値を追加
const minDate = new Date('2025/04/13').setHours(0, 0, 0, 0);
if (!tickPositions.includes(minDate)) {
  tickPositions.unshift(minDate);
}

let chart; // チャートインスタンス

// グラフの描画関数
function renderChart() {
  chart = Highcharts.chart('g_container', {
    chart: {
      type: 'area',
      backgroundColor: 'rgba(0, 0, 0, 0.3)',
      spacing: [30, 20, 20, 20]
    },
    title: {
      text: 'ダイヤの納品数',
      style: { color: '#ddd', fontSize: '14px' }
    },
    xAxis: {
      type: 'datetime',
      categories: null, // categoriesは使わない
      tickPositions: tickPositions,
      min: new Date('2025/04/13').getTime(),
      labels: {
        style: { color: 'rgba(255, 255, 255, 0.5)' },
        formatter: function () {
          return Highcharts.dateFormat('%m/%d', this.value) + '(日)';
        }
      },
      gridLineColor: 'rgba(255, 255, 255, 0.5)',
  
      plotBands: (() => {
        const bands = [];
        const start = new Date('2025/04/13').getTime();
        const end = new Date(dates[dates.length - 1]).getTime();
        const oneWeek = 7 * 24 * 3600 * 1000;
        let current = start;
        let toggle = true;
        while (current < end) {
          bands.push({
            from: current,
            to: current + oneWeek,
            color: toggle ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0)', // 薄い白と透明
            zIndex: 0
          });
          current += oneWeek;
          toggle = !toggle;
        }
        return bands;
      })()
    },
    yAxis: [
      {
        title: { text: 'ダイヤ数', style: { color: '#00eaff' } },
        labels: { style: { color: '#00eaff' } },
        tickAmount: 5,
        gridLineColor: 'rgba(100, 100, 100, 0.5)'
      },
      {
        title: { text: '進捗率', style: { color: '#ffff00' } },
        labels: { format: '{value}%', style: { color: '#ffff00' } },
        opposite: true,
        max: 100,
        min: 0,
        endOnTick: false,
        startOnTick: false,
        maxPadding: 0,
        tickAmount: 5,
        gridLineColor: 'rgba(100, 100, 100, 0.5)'
      }
    ],
    series: [
      {
        name: 'ダイヤ',
        data: diamondTotals.map((y, i) => [dateTimestamps[i], y]), // [timestamp, value]
        color: '#00eaff',
        fillColor: {
          linearGradient: [0, 0, 0, 300],
          stops: [
            [0, 'rgba(0, 234, 255, 0.8)'],
            [1, 'rgba(0, 100, 130, 0.2)']
          ]
        },
          marker: {
            enabled: true,
            radius: 3,
            fillColor: '#00eaff',
            lineColor: '#ffffff',
            lineWidth: 1
          }
      },
      {
        name: '進捗率',
        type: 'line',
        yAxis: 1,
        data: progressPercentage.map((v, i) => [dateTimestamps[i], v]),
        color: '#ffff00',
        dashStyle: 'ShortDash',
        zIndex: 1,
        marker: {
          enabled: true,
          radius: 4,
          fillColor: '#ffff00',
          lineColor: '#333333',
          lineWidth: 1
        }
      }
    ],
    tooltip: {
      formatter: function () {
        const index = this.point.index;
        let diff = 0;

        if (this.series.name === 'ダイヤ') {
          if (index > 0) {
            diff = this.y - diamondTotals[index - 1];
            return `第${times[index]}回（${dates[index]}）<br/>${this.series.name}: <b>${this.y}</b><br/>前回との差分: <b>${diff >= 0 ? '+' + diff : diff}</b>`;
          }
          return `第${times[index]}回（${dates[index]}）<br/>${this.series.name}: <b>${this.y}</b>`;
        }

        if (this.series.name === '進捗率') {
          diff = 0;
          if (index > 0) {
            diff = this.y - progressPercentage[index - 1];
            return `第${times[index]}回（${dates[index]}）<br/>${this.series.name}: <b>${this.y.toFixed(2)}%</b><br/>前回との差分: <b>${diff >= 0 ? '+' + diff.toFixed(2) : diff.toFixed(2)}%</b>`;
          }
          return `第${times[index]}回（${dates[index]}）<br/>${this.series.name}: <b>${this.y.toFixed(2)}%</b>`;
        }

        return `${this.series.name}: <b>${this.y}</b>`;
      }
    },
    legend: {
      enabled: false
    },
    credits: { enabled: false }
  });
}

  // トグルボタン処理
  const toggleButton = document.getElementById('toggleButton');
  const gContainer = document.getElementById('g_container');
  let visible = false;

  toggleButton.addEventListener('click', () => {
    visible = !visible;
    gContainer.style.display = visible ? 'block' : 'none';
    toggleButton.textContent = visible
      ? 'グラフを隠す▲'
      : '今まで掘ったダイヤ数をグラフで確認▼';
    if (visible && !chart) {
      renderChart();
    }
  });



//----------
// ピラミッド
const MAX_ROWS = 100;
const pyramid = document.getElementById("pyramid");
const diaCountInput = document.getElementById("diaCount");
const topStartBtn = document.getElementById("topStart");
const bottomStartBtn = document.getElementById("bottomStart");
const resetBtn = document.getElementById("reset");
const cancelBtn = document.getElementById("cancel");
const delayMs = 1;

let blockRefs = []; // 各段のブロック配列
let animationTimeouts = []; // アニメーションタイマー格納
let currentDirection = "top"; // 現在の描画方向を保持

function getPaintCostPerBlock(row) {
  const level = row + 1;
  return ((2 * level - 1 - 1) * 4) / (2 * level - 1);
}

function getTotalPaintNeeded() {
  let total = 0;
  for (let row = 0; row < MAX_ROWS; row++) {
    const blockCount = row * 2 + 1;
    const costPerBlock = getPaintCostPerBlock(row);
    total += blockCount * costPerBlock;
  }
  return Math.round(total) + 1;
}

const totalNeededDia = getTotalPaintNeeded();

function createPyramidFrame(direction = "top") {
  pyramid.innerHTML = "";
  blockRefs = [];

  for (let i = 0; i < MAX_ROWS; i++) {
    const row = document.createElement("div");
    row.className = "row";
    const blocks = [];

    const blockCount = i * 2 + 1;
    for (let j = 0; j < blockCount; j++) {
      const block = document.createElement("div");
      block.className = "block";
      if (i % 2 === 1) {
        block.className += " odd";
      }
      row.appendChild(block);
      blocks.push(block);
    }

    if ((i + 1) % 10 === 0) {
      const rowNumber = document.createElement("div");
      const numberText = document.createElement("span");
      let rowValue;
      if(direction === "bottom") {
        rowNumber.className = "row-number btm";
        numberText.className = "number-text btm";
        rowValue = MAX_ROWS - i;
      } else {
        rowNumber.className = "row-number";
        numberText.className = "number-text";
        rowValue = i + 2;
      }

      numberText.textContent = rowValue - 1; // 0, 10, 20, ..., 90, 99

      rowNumber.appendChild(numberText);
      row.appendChild(rowNumber);
    }

    pyramid.appendChild(row);
    blockRefs.push(blocks);
  }
}

function clearBlocks() {
  animationTimeouts.forEach(timeout => clearTimeout(timeout));
  animationTimeouts = [];
  blockRefs.flat().forEach(block => block.classList.remove("visible"));
}

function animateBlocks(direction) {
  clearBlocks();
  currentDirection = direction;
  createPyramidFrame(direction);

  let diamonds = parseInt(diaCountInput.value) || 0;
  let totalDiamonds = Math.floor(diamonds / 9);
  document.getElementById("diamondBlocks").value = totalDiamonds;
  document.getElementById("progress").textContent =
    `現在の進捗は${(Math.min(Math.floor(((diamonds / 356409) * 100) * 100) / 100, 100))}%です。`;

  if (totalDiamonds <= 0) return;

  const rows = direction === "top" ? [...blockRefs] : [...blockRefs].reverse();
  let delay = 0;

  for (let r = 0; r < rows.length; r++) {
    const realRow = direction === "top" ? r : MAX_ROWS - 1 - r;
    const blocks = rows[r];
    const blockCount = blocks.length;
    const costPerBlock = getPaintCostPerBlock(realRow);
    const rowCost = blockCount * costPerBlock;

    if (totalDiamonds >= rowCost) {
      blocks.forEach((block, i) => {
        const timeoutId = setTimeout(() => {
          block.classList.add("visible");
        }, delay);
        animationTimeouts.push(timeoutId);
        delay += delayMs;
      });
      totalDiamonds -= rowCost;
    } else {
      const fillable = Math.floor(totalDiamonds / costPerBlock);
      for (let i = 0; i < fillable; i++) {
        const timeoutId = setTimeout(() => {
          blocks[i].classList.add("visible");
        }, delay);
        animationTimeouts.push(timeoutId);
        delay += delayMs;
      }
      break;
    }
  }
}

// イベント設定
topStartBtn.addEventListener("click", () => animateBlocks("top"));
bottomStartBtn.addEventListener("click", () => animateBlocks("bottom"));
cancelBtn.addEventListener("click", () => clearBlocks());
resetBtn.addEventListener("click", () => {
  clearBlocks();
  createPyramidFrame(currentDirection);
  document.getElementById("diamondBlocks").value = "";
  document.getElementById("progress").textContent = `現在の進捗は　%です。`;
});

// 初期表示
createPyramidFrame();


// URLパラメータで自動描画処理
function getQueryParams() {
  const params = {};
  window.location.search.slice(1).split("&").forEach(part => {
    const [key, val] = part.split("=");
    if (key) params[key] = decodeURIComponent(val || "");
  });
  return params;
}

window.addEventListener("DOMContentLoaded", () => {
  const params = getQueryParams();
  const diamonds = parseInt(params.d, 10);

  if (!isNaN(diamonds)) {
    diaCountInput.value = diamonds;
    const from = params.from === "top" ? "top" : "bottom";
    animateBlocks(from);
  }
});

    
  </script>
</body>
</html>
