<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            overflow-x: hidden;
        }
        
        h1 {
            color: white;
            text-align: center;
            padding: 30px 0;
            font-size: 28px;
        }
        
        .slider-row {
            margin-bottom: 20px;
        }
        
        .swiper {
            width: 100vw;
            height: 20vh;
        }
        
        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            width: auto !important;
        }
        
        .swiper-wrapper {
            transition-timing-function: linear !important;
        }
        
        .slide {
            height: 100%;
            width: auto;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }
        
        .info {
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .info code {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            color: #4facfe;
        }
    </style>
</head>

    <div class="info">

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <script>
        // 1列目（右方向）
        const swiper1 = new Swiper('.swiper1', {
            slidesPerView: 'auto',
            spaceBetween: 0,
            loop: true,
            speed: 4000,
            autoplay: {
                delay: 0,
                disableOnInteraction: false,
            },
            freeMode: true,
            freeModeMomentum: false,
            allowTouchMove: false,  // ドラッグ無効
            simulateTouch: false,   // タッチ操作無効
        });
        
        // 2列目（左方向・速度違い）
        const swiper2 = new Swiper('.swiper2', {
            slidesPerView: 'auto',
            spaceBetween: 0,
            loop: true,
            speed: 5000,
            autoplay: {
                delay: 0,
                disableOnInteraction: false,
                reverseDirection: true,  // 逆方向
            },
            freeMode: true,
            freeModeMomentum: false,
            allowTouchMove: false,
            simulateTouch: false,
        });
        
        // 3列目（右方向・さらに速度違い）
        const swiper3 = new Swiper('.swiper3', {

            freeMode: true,

            allowTouchMove: false,
