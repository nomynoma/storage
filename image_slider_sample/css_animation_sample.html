<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation版 - 3列スライダー</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            overflow-x: hidden;
        }

        h1 {
            color: white;
            text-align: center;
            padding: 30px 0;
            font-size: 28px;
        }

        .slider-row {
            margin-bottom: 20px;
        }

        .slider-container {
            width: 100vw;
            height: 20vh;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        .slider {
            display: flex;
            width: fit-content;
            height: 100%;
        }

        .slider.animate-right {
            animation: slideRight 20s linear infinite;
        }

        .slider.animate-left {
            animation: slideLeft 20s linear infinite;
        }

        .slider.animate-right-fast {
            animation: slideRight 15s linear infinite;
        }

        @keyframes slideRight {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        @keyframes slideLeft {
            0% {
                transform: translateX(-50%);
            }
            100% {
                transform: translateX(0);
            }
        }

        .slide {
            height: 100%;
            width: auto;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            flex-shrink: 0;
        }

        .info {
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            line-height: 1.8;
        }

        .info code {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            color: #4facfe;
        }
    </style>
</head>
<body>
    <h1>CSS Animation版 - 3列スライダー</h1>

    <div class="info">
        CSSアニメーションでシームレスな無限ループを実現<br>
        速度調整はCSSの<code>animation-duration</code>で変更可能
    </div>

    <!-- 1列目（右方向） -->
    <div class="slider-row">
        <div class="slider-container">
            <div class="slider" id="slider1" data-images='["https://picsum.photos/1920/1080?random=1", "https://picsum.photos/1920/1080?random=2", "https://picsum.photos/1920/1080?random=3", "https://picsum.photos/1920/1080?random=4", "https://picsum.photos/1920/1080?random=5"]'></div>
        </div>
    </div>

    <!-- 2列目（左方向） -->
    <div class="slider-row">
        <div class="slider-container">
            <div class="slider" id="slider2" data-images='["https://picsum.photos/1920/1080?random=6", "https://picsum.photos/1920/1080?random=7", "https://picsum.photos/1920/1080?random=8", "https://picsum.photos/1920/1080?random=9", "https://picsum.photos/1920/1080?random=10"]'></div>
        </div>
    </div>

    <!-- 3列目（右方向・速度違い） -->
    <div class="slider-row">
        <div class="slider-container">
            <div class="slider" id="slider3" data-images='["https://picsum.photos/1920/1080?random=11", "https://picsum.photos/1920/1080?random=12", "https://picsum.photos/1920/1080?random=13", "https://picsum.photos/1920/1080?random=14", "https://picsum.photos/1920/1080?random=15"]'></div>
        </div>
    </div>

    <script>
        /**
         * CSSアニメーション式スライダー初期化関数
         * @param {string} id - スライダーのID
         * @param {number} duration - 1周するのにかかる秒数
         * @param {boolean} reverse - 逆方向にするか（デフォルト: false）
         */
        function createSlider(id, duration = 20, reverse = false) {
            const slider = document.getElementById(id);
            const images = JSON.parse(slider.dataset.images || '[]');

            // 画像を2セット生成してシームレスループを実現
            images.forEach((src, index) => {
                const img = document.createElement('img');
                img.src = src;
                img.alt = `画像${index + 1}`;
                img.className = 'slide';
                img.loading = 'lazy';
                slider.appendChild(img);
            });

            // 複製（2セット目）
            images.forEach((src, index) => {
                const img = document.createElement('img');
                img.src = src;
                img.alt = `画像${index + 1}`;
                img.className = 'slide';
                img.loading = 'lazy';
                slider.appendChild(img);
            });

            // アニメーション用のキーフレーム名を生成
            const animationName = `slide${reverse ? 'Left' : 'Right'}`;

            // アニメーションを適用
            slider.style.animation = `${animationName} ${duration}s linear infinite`;
        }

        // 各スライダーを初期化
        createSlider('slider1', 20, false);  // 1列目（右方向、20秒）
        createSlider('slider2', 20, true);   // 2列目（左方向、20秒）
        createSlider('slider3', 15, false);  // 3列目（右方向、15秒・速い）
    </script>
</body>
</html>
