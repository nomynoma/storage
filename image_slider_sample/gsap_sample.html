<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP版 - 3列スライダー</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            overflow-x: hidden;
        }
        
        h1 {
            color: white;
            text-align: center;
            padding: 30px 0;
            font-size: 28px;
        }
        
        .slider-row {
            margin-bottom: 20px;
        }
        
        .gsap-container {
            width: 100vw;
            height: 300px;
            overflow: hidden;
            position: relative;
            background: #000;
        }
        
        .gsap-slider {
            display: flex;
            width: fit-content;
            height: 100%;
        }
        
        .slide {
            height: 100%;
            width: auto;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            flex-shrink: 0;
        }
        
        .info {
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .info code {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            color: #4facfe;
        }
    </style>
</head>
<body>
    <h1>GSAP版 - 3列スライダー</h1>
    
    <div class="info">
        速度調整: <code>createGsapSlider('gsap1', 3)</code> ← この数値を変更<br>
        逆方向: <code>createGsapSlider('gsap2', 4, true)</code> ← 第3引数をtrue
    </div>
    
    <!-- 1列目（右方向） -->
    <div class="slider-row">
        <div class="gsap-container">
            <div class="gsap-slider" id="gsap1">
                <img src="https://picsum.photos/1920/1080?random=1" alt="画像1" class="slide" loading="lazy">
                <img src="https://picsum.photos/1920/1080?random=2" alt="画像2" class="slide" loading="lazy">
                <img src="https://picsum.photos/1920/1080?random=3" alt="画像3" class="slide" loading="lazy">
                <img src="https://picsum.photos/1920/1080?random=4" alt="画像4" class="slide" loading="lazy">
                <img src="https://picsum.photos/1920/1080?random=5" alt="画像5" class="slide" loading="lazy">
                <!-- ループ用に最初の画像を複製 -->
                <img src="https://picsum.photos/1920/1080?random=1" alt="画像1" class="slide" loading="lazy">
            </div>
        </div>
    </div>
    
    <!-- 2列目（左方向） -->
    <div class="slider-row">
        <div class="gsap-container">
            <div class="gsap-slider" id="gsap2">
                <img src="https://picsum.photos/1920/1080?random=6" alt="画像6" class="slide" loading="lazy">
                <img src="https://picsum.photos/1920/1080?random=7" alt="画像7" class="slide" loading="lazy">
                <img src="https://picsum.photos/1920/1080?random=8" alt="画像8" class="slide" loading="lazy">
                <img src="https://picsum.photos/1920/1080?random=9" alt="画像9" class="slide" loading="lazy">
                <img src="https://picsum.photos/1920/1080?random=10" alt="画像10" class="slide" loading="lazy">
                <!-- ループ用に最初の画像を複製 -->
                <img src="https://picsum.photos/1920/1080?random=6" alt="画像6" class="slide" loading="lazy">
            </div>
        </div>
    </div>
    
    <!-- 3列目（右方向・速度違い） -->
    <div class="slider-row">
        <div class="gsap-container">
            <div class="gsap-slider" id="gsap3">
                <img src="https://picsum.photos/1920/1080?random=11" alt="画像11" class="slide" loading="lazy">
                <img src="https://picsum.photos/1920/1080?random=12" alt="画像12" class="slide" loading="lazy">
                <img src="https://picsum.photos/1920/1080?random=13" alt="画像13" class="slide" loading="lazy">
                <img src="https://picsum.photos/1920/1080?random=14" alt="画像14" class="slide" loading="lazy">
                <img src="https://picsum.photos/1920/1080?random=15" alt="画像15" class="slide" loading="lazy">
                <!-- ループ用に最初の画像を複製 -->
                <img src="https://picsum.photos/1920/1080?random=11" alt="画像11" class="slide" loading="lazy">
            </div>
        </div>
    </div>
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <script>
        function createGsapSlider(id, {
          secondsPerSlide = 4,
          reverse = false
        }) {
          const slider = document.getElementById(id);
          if (!slider) return;
        
          let tween;
          const direction = reverse ? 1 : -1;
        
          function setup() {
            if (tween) tween.kill();
        
            const slides = Array.from(slider.querySelectorAll('.slide'));
        
            // 最後の1枚は複製なので除外
            const realSlides = slides.slice(0, slides.length - 1);
            if (!realSlides.length) return;
        
            const slideWidth = realSlides[0].getBoundingClientRect().width;
            if (!slideWidth) return;
        
            const totalWidth = slideWidth * realSlides.length;
            const duration = secondsPerSlide * realSlides.length;
        
            // 開始位置
            gsap.set(slider, {
              x: reverse ? -totalWidth : 0
            });
        
            tween = gsap.to(slider, {
              x: direction * totalWidth,
              duration,
              ease: "none",
              repeat: -1,
              modifiers: {
                x: gsap.utils.unitize(x => {
                  return parseFloat(x) % totalWidth;
                })
              }
            });
          }
        
          // 画像ロード完了後に初期化
          window.addEventListener('load', setup);
        
          // リサイズ対応
          const ro = new ResizeObserver(setup);
          ro.observe(slider.parentElement);
        }
        
        // 初期化（見た目そのまま）
        createGsapSlider('gsap1', { secondsPerSlide: 4, reverse: false });
        createGsapSlider('gsap2', { secondsPerSlide: 4, reverse: true });
        createGsapSlider('gsap3', { secondsPerSlide: 4, reverse: false });
    </script>


</body>
</html>
