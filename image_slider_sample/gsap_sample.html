<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP版 - 3列スライダー</title>
    
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
}

h1 {
  text-align: center;
  padding: 24px 0;
}

.slider-row {
  margin-bottom: 24px;
}

.gsap-container {
  width: 100%;
  height: 300px;
  overflow: hidden;
  background: #000;
}

.gsap-slider {
  display: flex;
  height: 100%;
}

.slide {
  height: 100%;
  width: auto;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  flex-shrink: 0;
  display: block;
}
</style>
</head>

<body>

<h1>GSAP 無限スライダー（完全対称・可変・レスポンシブ）</h1>

<!-- 右方向 -->
<div class="slider-row">
  <div class="gsap-container">
    <div class="gsap-slider" id="slider1">
      <img class="slide" src="https://picsum.photos/1920/1080?1">
      <img class="slide" src="https://picsum.photos/1920/1080?2">
      <img class="slide" src="https://picsum.photos/1920/1080?3">
      <img class="slide" src="https://picsum.photos/1920/1080?4">
    </div>
  </div>
</div>

<!-- 左方向 -->
<div class="slider-row">
  <div class="gsap-container">
    <div class="gsap-slider" id="slider2">
      <img class="slide" src="https://picsum.photos/1920/1080?5">
      <img class="slide" src="https://picsum.photos/1920/1080?6">
      <img class="slide" src="https://picsum.photos/1920/1080?7">
      <img class="slide" src="https://picsum.photos/1920/1080?8">
    </div>
  </div>
</div>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
function createInfiniteSlider(slider, {
  secondsPerSlide = 4,
  reverse = false
}) {
  let tween;
  const direction = reverse ? 1 : -1;

  function setup() {
    if (tween) tween.kill();

    const slides = slider.querySelectorAll('.slide');
    if (!slides.length) return;

    const slideWidth = slides[0].getBoundingClientRect().width;
    const totalWidth = slideWidth * slides.length;

    // ループ用に自動複製（不足分だけ）
    while (slider.scrollWidth < totalWidth * 2) {
      slides.forEach(slide => {
        slider.appendChild(slide.cloneNode(true));
      });
    }

    const duration = secondsPerSlide * slides.length;

    tween = gsap.to(slider, {
      x: direction * totalWidth,
      duration,
      ease: "none",
      repeat: -1,
      modifiers: {
        x: gsap.utils.unitize(x => {
          const v = parseFloat(x) % totalWidth;
          return v;
        })
      }
    });
  }

  setup();

  // リサイズ完全対応
  const ro = new ResizeObserver(setup);
  ro.observe(slider.parentElement);
}

// 初期化（direction 以外は全共通）
createInfiniteSlider(
  document.getElementById("slider1"),
  { secondsPerSlide: 4, reverse: false }
);

createInfiniteSlider(
  document.getElementById("slider2"),
  { secondsPerSlide: 4, reverse: true }
);
</script>

</body>
</html>
