<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クイズアプリ</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden; /* スマホでの余計なスクロールを防ぐ */
}

iframe {
  position: fixed; /* スマホでも確実に全画面に張り付く */
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  border: none;
  display: block;
}
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbzvAZJ0SWINjApHadksh4qTEJMUvvi1BGoRhvQ_aujbd2na-uIJojR-aXjpCASMAcbK/exec"></iframe>
</body>
